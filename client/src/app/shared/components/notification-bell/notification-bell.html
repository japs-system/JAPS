<div class="relative">
  <button
    type="button"
    (click)="toggle()"
    class="relative w-9 h-9 flex items-center justify-center text-gray-600 hover:text-[#1E5AAA] transition-colors cursor-pointer"
    aria-label="Notifications"
  >
    <i class="pi pi-bell text-lg"></i>
    @if (svc.unreadCount() > 0) {
      <span
        class="absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] px-1 rounded-full bg-red-600 text-white text-[11px] font-semibold flex items-center justify-center border-2 border-white"
      >
        {{ svc.unreadCount() > 9 ? '9+' : svc.unreadCount() }}
      </span>
    }
  </button>

  @if (open()) {
    <!-- Phones: pinned under the header and sized to the screen.
         sm and up: a normal dropdown under the bell. -->
    <div
      class="fixed inset-x-3 top-[60px] sm:absolute sm:inset-x-auto sm:top-auto sm:right-0 sm:mt-2 sm:w-[380px] bg-white rounded-xl shadow-xl ring-1 ring-black/5 overflow-hidden z-50"
    >
      <div class="px-4 py-3 flex items-center justify-between border-b border-gray-200">
        <span class="text-sm font-semibold text-gray-800">Notifications</span>
        @if (svc.unreadCount() > 0) {
          <button
            type="button"
            (click)="svc.markAllRead()"
            class="text-xs font-semibold text-[#1E5AAA] hover:underline cursor-pointer"
          >
            Mark all as read
          </button>
        }
      </div>

      <div class="max-h-[70vh] sm:max-h-[420px] overflow-y-auto divide-y divide-gray-100">
        @for (n of svc.items(); track n.id) {
          @let s = iconFor(n.type);
          <button
            type="button"
            (click)="openItem(n)"
            class="w-full text-left flex gap-3 px-4 py-3 hover:bg-gray-50 cursor-pointer"
            [class.bg-blue-50]="!n.read_at"
          >
            <span
              class="w-9 h-9 shrink-0 rounded-full flex items-center justify-center"
              [class]="s.bg + ' ' + s.fg"
            >
              <i class="pi text-base" [class]="s.icon"></i>
            </span>
            <span class="flex-1 min-w-0">
              <span class="block text-[13px] text-gray-800" [class.font-semibold]="!n.read_at">{{ n.title }}</span>
              <span class="block text-xs text-gray-500 mt-0.5 leading-snug break-words">{{ n.message }}</span>
              <span class="block text-[11px] text-gray-400 mt-1">{{ timeAgo(n.created_at) }}</span>
            </span>
            @if (!n.read_at) {
              <span class="w-2 h-2 mt-1.5 rounded-full bg-[#1E5AAA] shrink-0"></span>
            }
          </button>
        } @empty {
          <div class="px-4 py-10 text-center text-sm text-gray-400">
            <i class="pi pi-bell-slash text-2xl mb-2 block"></i>
            No new notifications
          </div>
        }
      </div>
    </div>
  }
</div>
