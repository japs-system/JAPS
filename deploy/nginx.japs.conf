# JAPS — Nginx config (Amazon Linux 2023: /etc/nginx/conf.d/japs.conf)
#
# This is the HTTP-only starting point. Deploy it as-is, reload nginx, then
# run setup-ssl.sh — certbot's nginx plugin rewrites this file in place to
# add the HTTPS server block, the cert paths, and the 80->443 redirect.
# Don't hand-add a 443/ssl block here first; let certbot do it.
#
# Placeholders (substituted by render-nginx-config.sh):
#   __SSLIP_DOMAIN__  e.g. 3-25-100-42.sslip.io
#   __APP_DIR__       e.g. /home/ec2-user/japs

server {
    listen 80;
    listen [::]:80;
    server_name __SSLIP_DOMAIN__;

    # Angular SPA build output
    root __APP_DIR__/client/dist/client/browser;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API — proxied to the PM2-managed Node process. No path suffix
    # on proxy_pass, so the full /api/... URI is forwarded unchanged, matching
    # how the Express routes are mounted (app.use("/api/auth", ...) etc).
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }
}
